name: collect-youtube-rank

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect ranks
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python youtube_rank_collector.py

      - name: Commit results (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json dashboard.html
          git commit -m "update ranks" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "저장 충돌 - 재시도 $i ..."; sleep 5
          done
          echo "push 최종 실패"; exit 1
