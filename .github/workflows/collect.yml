name: collect-youtube-rank

on:
  schedule:
    - cron: "7 1 * * *"
    - cron: "13 2 * * *"
    - cron: "27 4 * * *"
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-collect even if today already collected"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect ranks
        env:
          YT_API_KEY: ${{ github.event_name != 'schedule' && secrets.YT_API_KEY_TEST || (github.event.schedule == '7 1 * * *' && secrets.YT_API_KEY || secrets.YT_API_KEY_TEST) }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python youtube_rank_collector.py

      - name: Commit results (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json dashboard.html
          git commit -m "update ranks" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "retry $i ..."; sleep 5
          done
          echo "push failed"; exit 1
